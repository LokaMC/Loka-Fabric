plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
version = '1.0.0'
group = 'com.lokamc'
base { archivesName = 'loka-ui' }
// Allow builds outside OneDrive when sync locks stale compilation directories.
layout.buildDirectory = file(findProperty('lokaBuildDirectory') ?: 'build')
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar { from('LICENSE') }
tasks.register('presenceChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lokamc.ui.presence.PresenceChecks'
    if (findProperty('lokaTestUuid')) args findProperty('lokaTestUuid')
}
tasks.named('check') { dependsOn 'presenceChecks' }
// The executable regression harness above intentionally needs no JUnit dependency.
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.register('craftPresenceChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + files(findProperty('lokaCraftPresenceJar'), findProperty('lokaUniLibJar'))
    mainClass = 'com.lokamc.ui.presence.CraftPresenceChecks'
    args findProperty('lokaPresenceConfig') ?: 'run/config/craftpresence.json'
}
